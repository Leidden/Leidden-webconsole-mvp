name: build-and-push

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "webconsole-mvp-design.md"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/leidden-webconsole-mvp
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.prod
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: self-hosted
    steps:
      # Authenticate the host docker daemon so `compose pull` works
      # regardless of the package's visibility (public or private).
      - name: Log in to GHCR (host docker daemon)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull latest source on host
        working-directory: /home/ubuntu/projects/Leidden-webconsole-mvp
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Switch to prod compose
        working-directory: /home/ubuntu/projects/Leidden-webconsole-mvp
        run: |
          # Stop whichever compose is currently up (dev or prod). Named
          # volumes (postgres_data, etc.) survive across `down`, so user
          # accounts and migrations carry over between runs.
          docker compose -f docker-compose.yml down 2>/dev/null || true
          docker compose -f docker-compose.prod.yml pull
          docker compose -f docker-compose.prod.yml up -d --remove-orphans

      - name: Wait for /api/health
        run: |
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:3000/api/health || true)
            if [ "$code" = "200" ]; then
              echo "ready (try $i)"
              exit 0
            fi
            sleep 5
          done
          echo "TIMEOUT" >&2
          docker compose -f /home/ubuntu/projects/Leidden-webconsole-mvp/docker-compose.prod.yml \
            logs --tail=80 app || true
          exit 1

      - name: Prune old images (24h+)
        run: docker image prune -f --filter "until=24h" || true
